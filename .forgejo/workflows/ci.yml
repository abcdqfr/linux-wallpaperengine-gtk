---
# Canonical Forgejo Actions workflow (Forgejo checks `.forgejo/workflows` first,
# then falls back to `.github/workflows`).
#
# Local smoke (no Actions matrix): `./scripts/ci-local.sh` (venv `.venv-ci/`).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Conventional Commit subjects
        run: |
          set -euo pipefail

          # Determine the range to validate.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            # `base_ref` is set for PR events in the Actions compatibility layer.
            base_ref="${GITHUB_BASE_REF:-}"
            if [ -z "${base_ref}" ]; then
              echo "missing GITHUB_BASE_REF for pull_request" >&2
              exit 2
            fi
            git fetch --no-tags origin "${base_ref}:${base_ref}" >/dev/null 2>&1 || true
            range="${base_ref}..HEAD"
          else
            before="${GITHUB_EVENT_BEFORE:-}"
            sha="${GITHUB_SHA:-HEAD}"
            if [ -n "${before}" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              range="${before}..${sha}"
            else
              # Fallback: validate the last 50 commits (covers first push / missing before).
              range="HEAD~50..HEAD"
            fi
          fi

          echo "Validating commit subjects in range: ${range}"

          # Allowed types (keep in sync with Cursor rule + release.sh bump parser).
          pattern='^(feat|fix|chore|ci|build|test|docs)(\\([a-z0-9._-]+\\))?(!)?: .+'

          bad=0
          while IFS= read -r subj; do
            if ! printf '%s\n' "${subj}" | python3 -c "import re,sys; sys.exit(0 if re.match(r'${pattern}', sys.stdin.read().rstrip()) else 1)"; then
              echo "::error::Bad commit subject: ${subj}"
              bad=1
            fi
          done < <(git log --format=%s "${range}")

          if [ "${bad}" -ne 0 ]; then
            echo "::error::Commit subjects must match: <type>(<scope>)?!: <summary>"
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Core gates (shared with GitHub CI)
        run: bash scripts/ci-core.sh

      - name: Install extended analysis dependencies
        run: |
          pip install bandit pylint mypy radon vulture pytest-cov pytest-mock black pre-commit

      - name: Run Ruff
        run: ruff check linux-wallpaperengine-gtk.py --output-format=github

      # Scope to our sources only — skip bundled `upstream/` engine tree (noise + slow).
      - name: Run Bandit (Security)
        run: >-
          bandit -r linux-wallpaperengine-gtk.py wallpaper_process_probe.py scripts tests
          -ll -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Pylint
        run: |
          pylint linux-wallpaperengine-gtk.py \
            --max-line-length=100 \
            --output-format=json > pylint-report.json || true
        continue-on-error: true

      - name: Run MyPy
        run: mypy linux-wallpaperengine-gtk.py --ignore-missing-imports || true
        continue-on-error: true

      - name: Run Radon (Complexity)
        run: radon cc linux-wallpaperengine-gtk.py --min B || true
        continue-on-error: true

      - name: Run Vulture (Dead Code)
        run: vulture linux-wallpaperengine-gtk.py --min-confidence 80 || true
        continue-on-error: true

      - name: Check for shell injection risks
        run: |
          if grep -n "shell=True" linux-wallpaperengine-gtk.py; then
            echo "::error::Found shell=True (security risk)!"
            exit 1
          fi

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Typelibs + build deps so `pip install PyGObject` matches setup-python (closes GTK import gap vs system-only python3-gi).
      - name: Install GTK / GObject introspection deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0

      - name: PyGObject import smoke (headless)
        run: |
          python -m pip install PyGObject
          python -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('Gdk', '3.0'); gi.require_version('GdkPixbuf', '2.0'); gi.require_version('GLib', '2.0'); from gi.repository import Gtk; print('gtk-ok', Gtk.get_major_version())"

      - name: App self-test (headless)
        run: |
          set -euo pipefail

          # Minimal fixture wallpaper_dir + stub "engine" executable.
          mkdir -p /tmp/lwpeg-fixture/431960/123
          cat >/tmp/lwpeg-fixture/431960/123/project.json <<'EOF'
          {"file":"video.mp4"}
          EOF
          : >/tmp/lwpeg-fixture/431960/123/video.mp4

          cat >/tmp/lwpeg-stub-engine <<'EOF'
          #!/usr/bin/env sh
          exit 0
          EOF
          chmod +x /tmp/lwpeg-stub-engine

          export LWPEG_SELFTEST_WPE_PATH=/tmp/lwpeg-stub-engine
          export LWPEG_SELFTEST_WALLPAPER_DIR=/tmp/lwpeg-fixture/431960
          python linux-wallpaperengine-gtk.py --self-test

      - uses: pre-commit/action@v3.0.0
