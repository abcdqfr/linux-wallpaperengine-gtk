---
# Canonical Forgejo Actions workflow (Forgejo checks `.forgejo/workflows` first,
# then falls back to `.github/workflows`).
#
# Local smoke (no Actions matrix): `./scripts/ci-local.sh` (venv `.venv-ci/`).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      # Fast, deterministic smoke: syntax + bytecode (no GTK / PyGObject required).
      - name: Byte-compile entrypoints
        run: python -m py_compile linux-wallpaperengine-gtk.py wallpaper_process_probe.py

      - name: Pytest (smoke + process lifecycle)
        run: pytest tests/ -v

      - name: Install extended analysis dependencies
        run: |
          pip install bandit pylint mypy radon vulture pytest-cov pytest-mock black pre-commit

      - name: Run Ruff
        run: ruff check linux-wallpaperengine-gtk.py --output-format=github

      # Scope to our sources only — skip bundled `upstream/` engine tree (noise + slow).
      - name: Run Bandit (Security)
        run: >-
          bandit -r linux-wallpaperengine-gtk.py wallpaper_process_probe.py scripts tests
          -ll -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Pylint
        run: |
          pylint linux-wallpaperengine-gtk.py \
            --max-line-length=100 \
            --output-format=json > pylint-report.json || true
        continue-on-error: true

      - name: Run MyPy
        run: mypy linux-wallpaperengine-gtk.py --ignore-missing-imports || true
        continue-on-error: true

      - name: Run Radon (Complexity)
        run: radon cc linux-wallpaperengine-gtk.py --min B || true
        continue-on-error: true

      - name: Run Vulture (Dead Code)
        run: vulture linux-wallpaperengine-gtk.py --min-confidence 80 || true
        continue-on-error: true

      - name: Check for shell injection risks
        run: |
          if grep -n "shell=True" linux-wallpaperengine-gtk.py; then
            echo "::error::Found shell=True (security risk)!"
            exit 1
          fi

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Typelibs + build deps so `pip install PyGObject` matches setup-python (closes GTK import gap vs system-only python3-gi).
      - name: Install GTK / GObject introspection deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0

      - name: PyGObject import smoke (headless)
        run: |
          python -m pip install PyGObject
          python -c "import gi; gi.require_version('Gtk', '3.0'); gi.require_version('Gdk', '3.0'); gi.require_version('GdkPixbuf', '2.0'); gi.require_version('GLib', '2.0'); from gi.repository import Gtk; print('gtk-ok', Gtk.get_major_version())"

      - uses: pre-commit/action@v3.0.0
