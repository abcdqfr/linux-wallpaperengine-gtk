---
name: Release (manual, gated)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version X.Y.Z (else derived from Conventional Commits since last v* tag)
        required: false
        default: ""

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Core gates (same as GitHub CI)
        run: bash scripts/ci-core.sh

  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [core]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GTK / GObject introspection deps (for PyGObject)
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest ruff PyGObject

      - name: Gates (pre-commit)
        run: pre-commit run --all-files

      - name: Headless self-test fixture
        run: |
          set -euo pipefail
          mkdir -p /tmp/lwpeg-fixture/431960/123
          cat >/tmp/lwpeg-fixture/431960/123/project.json <<'EOF'
          {"file":"video.mp4"}
          EOF
          : >/tmp/lwpeg-fixture/431960/123/video.mp4

          cat >/tmp/lwpeg-stub-engine <<'EOF'
          #!/usr/bin/env sh
          exit 0
          EOF
          chmod +x /tmp/lwpeg-stub-engine

          export LWPEG_SELFTEST_WPE_PATH=/tmp/lwpeg-stub-engine
          export LWPEG_SELFTEST_WALLPAPER_DIR=/tmp/lwpeg-fixture/431960
          python linux-wallpaperengine-gtk.py --self-test

      - name: Release (tag + Forgejo release + assets)
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
          # Must be reachable from the runner container/host.
          # If your runner is not on the Forgejo host network namespace, set this to the
          # Forgejo container hostname/IP on the runner network.
          FORGEJO_BASE_URL: ${{ vars.FORGEJO_BASE_URL }}
          FORGEJO_OWNER: abcdqfr
          FORGEJO_REPO: linux-wallpaperengine-gtk
        run: |
          if [ -z "${FORGEJO_TOKEN}" ]; then
            echo "::error::Missing Forgejo secret FORGEJO_RELEASE_TOKEN"
            exit 2
          fi
          if [ -z "${FORGEJO_BASE_URL}" ]; then
            echo "::error::Missing Forgejo variable FORGEJO_BASE_URL (runner must reach Forgejo API)"
            exit 2
          fi
          if [ -n "${{ inputs.version }}" ]; then
            ./scripts/release.sh --version "${{ inputs.version }}"
          else
            ./scripts/release.sh
          fi
