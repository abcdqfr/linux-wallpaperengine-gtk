---
# Fast, deterministic checks on every commit. Includes bytecode + pytest (no DISPLAY).
# Full PyGObject import is enforced in Forgejo CI (apt + smoke step), not in this file,
# so laptops without gir1.2-gtk-3.0 are not blocked locally.
default_language_version:
  python: python3

minimum_pre_commit_version: "3.2.0"

repos:
  # Ruff - Fast Python linter and formatter (always enabled)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        # Keep this aligned with `pyproject.toml` (select/ignore live there).
        # CI should fail if formatting/lint changes are needed, so we do NOT
        # auto-fix here.
        args: []
      - id: ruff-format

  # Black - Uncompromising Python code formatter (always enabled)
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  # Heavier analyzers (bandit/pylint/mypy/…) stay in `.forgejo/workflows/ci.yml`
  # (many continue-on-error). Pre-commit carries: byte-compile, pytest tests/,
  # ruff, black, hygiene hooks — plus Forgejo pre-commit job installs PyGObject
  # and runs a Gtk import smoke before `pre-commit/action`.

  # Custom hook: Check for common bugs (Python-based, not bash!)
  # References:
  #   - pre-commit local hooks: https://pre-commit.com/#repository-local-hooks
  #   - Python subprocess: https://docs.python.org/3/library/subprocess.html
  - repo: local
    hooks:
      - id: byte-compile-entrypoints
        name: Byte-compile entrypoints (syntax, no GTK import)
        language: python
        entry: python
        args:
          - -m
          - py_compile
          - linux-wallpaperengine-gtk.py
          - wallpaper_process_probe.py
        pass_filenames: false
        always_run: true

      - id: pytest-wallpaper
        name: pytest tests/ (smoke, process probe, run_wallpaper guard)
        language: python
        entry: pytest
        args: [tests/, -v, --tb=short]
        pass_filenames: false
        always_run: true
        additional_dependencies: [pytest]

      - id: check-shell-injection
        name: Check for shell injection risks
        entry: >-
          python3 -c "import sys; content = open('linux-wallpaperengine-gtk.py', 'r', encoding='utf-8').read();
          sys.exit(1 if 'shell=True' in content else 0)"
        language: system
        files: ^linux-wallpaperengine-gtk\.py$
        pass_filenames: false

      - id: check-broad-exceptions
        name: Check for bare except clauses
        entry: >-
          python3 -c "import sys, re; content = open('linux-wallpaperengine-gtk.py', 'r', encoding='utf-8').read();
          bare_except = re.findall(r'^\s*except\s*:', content, re.MULTILINE);
          sys.exit(1 if bare_except else 0)"
        language: system
        files: ^linux-wallpaperengine-gtk\.py$
        pass_filenames: false

  # NOTE: Prettier is intentionally omitted to keep pre-commit node-free and
  # avoid flakiness in CI runners without a pinned node toolchain.

  # Pre-commit hooks - Basic file hygiene (always enabled)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
        exclude: \.(jsonc|code-workspace)$  # JSONC handled by Prettier
      - id: check-toml
      - id: debug-statements
      - id: name-tests-test
      - id: requirements-txt-fixer
      - id: fix-byte-order-marker

  # ShellCheck - Shell script linter (always enabled)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # YAML linting (always enabled)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          - "--format"
          - "parsable"
          - "-d"
          - >-
            {extends: default, rules: {line-length: {max: 100, level: warning},
            truthy: {allowed-values: ['true', 'false'], check-keys: false}}}

  # NOTE: commitlint and jscpd are intentionally omitted to keep pre-commit
  # deterministic and node-free in CI.
